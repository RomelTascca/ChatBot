{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Asistente virtual</title>
  <link rel="stylesheet" href="{% static 'chat/css/chat.css' %}">
</head>
<body>
  <main class="chat" aria-label="Chat con el asistente virtual">
    <header class="chat__header">
      <div>
        <h1>Proyecto Chatbot</h1>
        <p>Pregúntame por horarios, precios, envíos, devoluciones o contacto.</p>
      </div>
      <button type="button" id="reset-btn" class="btn btn--ghost" title="Empezar una conversación nueva">Nueva conversación</button>
    </header>

    <section id="messages" class="chat__messages" role="log" aria-live="polite"></section>

    <p id="error-banner" class="chat__error" role="alert" hidden></p>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="{{ max_length }}"
             placeholder="Escribe tu mensaje..." aria-label="Mensaje" required>
      <button id="send-btn" type="submit" class="btn">Enviar</button>
    </form>
  </main>

  {{ history|json_script:"initial-history" }}
  <script src="{% static 'chat/js/chat.js' %}" defer></script>
</body>
</html>
