{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ STORE_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'chat:home' %}">{{ STORE_NAME }}</a>
    <nav>
      <a href="{% url 'chat:home' %}">Asistente</a>
      <a href="{% url 'catalog:product_list' %}">Productos</a>
      <a href="{% url 'catalog:offering_list' %}">Servicios</a>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer">
    {{ STORE_NAME }} · {{ STORE_HOURS }} · WhatsApp {{ STORE_WHATSAPP }}
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
